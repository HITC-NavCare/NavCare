description: Recommendation requests (one log line each), by engine and status.
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name="__SERVICE__" AND jsonPayload.event="recommendation"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: engine
      valueType: STRING
    - key: status
      valueType: STRING
labelExtractors:
  engine: EXTRACT(jsonPayload.engine)
  status: EXTRACT(jsonPayload.status)
