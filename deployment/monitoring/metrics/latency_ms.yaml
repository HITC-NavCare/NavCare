description: Server-side latency_ms by engine, without 503s (canary criteria 3 and 4).
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name="__SERVICE__" AND jsonPayload.event="recommendation" AND jsonPayload.status!=503 AND jsonPayload.latency_ms>=0
valueExtractor: EXTRACT(jsonPayload.latency_ms)
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: ms
  labels:
    - key: engine
      valueType: STRING
labelExtractors:
  engine: EXTRACT(jsonPayload.engine)
# Edges at the thresholds (5 s for v1, 30 s for v2), so p95 is compared to them exactly.
bucketOptions:
  explicitBuckets:
    bounds: [250, 500, 1000, 2000, 3000, 5000, 7500, 10000, 15000, 20000, 25000, 30000, 40000, 60000, 90000, 120000]
