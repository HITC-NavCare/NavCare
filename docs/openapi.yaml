openapi: 3.0.3
info:
  title: NAVCare API
  version: 0.1.0-draft
  description: |
    NAVCare ranks nearby Quebec emergency rooms (ERs) by expected time-to-care:
    travel time plus live and historical ER occupancy.

    **Not for life-threatening emergencies. Call 911.**

    ER data: Quebec Ministry of Health and Social Services (MSSS), hourly ER
    situation file, published on Données Québec under CC-BY 4.0. NAVCare stores
    hourly snapshots to compute historical occupancy patterns.

    `GET /v1/recommendations` is served by one of two implementations
    (v1 rules engine or v2 AI agent), chosen for each request by a facade:
    the canary split (`V2_TRAFFIC_PERCENT`), or the `X-Engine` header where
    it is enabled (testing and demo only, not production). Both return the
    same schema; the `engine` field says which one answered.
  contact:
    name: NAVCare team (COEN 424 / COEN 6313, Fall 2026)
    url: https://github.com/HITC-NavCare
servers:
  - url: https://navcare-api-dev-471599020734.northamerica-northeast1.run.app
    description: Dev service on Cloud Run (Montréal). API keys and /v1/hospitals are not live yet (#22).
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Recommendations
    description: Ranked ER recommendations for a location
  - name: Hospitals
    description: Quebec ERs with live status and historical patterns
  - name: System
    description: Service health
security:
  - ApiKeyAuth: []

paths:
  /v1/recommendations:
    get:
      tags: [Recommendations]
      operationId: getRecommendations
      summary: Recommend nearby ERs for a location
      description: |
        Returns the best ERs near the given location, ranked by expected
        time-to-care. Hospitals without current data are not ranked; they are
        listed in `unranked_nearby` instead.
      parameters:
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lon'
        - name: limit
          in: query
          description: Number of ranked ERs to return.
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 4
        - name: radius_km
          in: query
          description: Maximum straight-line distance for candidate ERs.
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
        - name: pediatric
          in: query
          description: If true, return only ERs that treat children.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Lang'
        - name: message
          in: query
          description: |
            Optional, in the person's own words (French or English), for
            example "my 6-year-old has a high fever". Only v2 reads it; when v1
            answers, `note` says the message was not taken into account.
          schema:
            type: string
            maxLength: 500
        - name: X-Engine
          in: header
          description: |
            Force one engine for this request (tests and demo). Only honoured
            where the server sets ENGINE_HEADER_ENABLED=true; in production it
            is ignored and the canary split decides.
          schema:
            type: string
            enum: [v1, v2]
      responses:
        '200':
          description: Ranked recommendations
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
              example:
                request_id: 7f3c2a9e-51b4-4c1e-9a0d-2e6f1b8c4d10
                requested_at: '2026-10-22T14:05:12-04:00'
                engine: v1
                call_911: null
                note: null
                model_usage: null
                data_updated_at: '2026-10-22T14:00:00-04:00'
                origin: { lat: 45.5017, lon: -73.5673 }
                radius_km: 50
                weather_now:
                  date: '2026-10-22 18:00:00+00:00'
                  temperature_2m: 8.4
                  precipitation: 0.0
                  snowfall: 0.0
                travel_time_multiplier: 1.0
                recommendations:
                  - rank: 1
                    hospital:
                      id: '51218097'
                      name: HÔPITAL DE VERDUN
                      address: 4000, boulevard LaSalle, Montréal, QC H4G 2A3
                      lat: 45.4640998840332
                      lon: -73.56400299072266
                    travel_minutes: 11.4
                    distance_km: 6.2
                    estimated_wait_minutes: 200
                    expected_minutes: 211
                    occupancy_rate: 0.95
                    patients_waiting: 12
                    patients_over_24h: 3
                    avg_ambulatory_stay_hours: 3.5
                    reason: 'Fastest expected care: about 11 min drive + 200 min in the ER.'
                  - rank: 2
                    hospital:
                      id: '12934659'
                      name: HÔPITAL MAISONNEUVE-ROSEMONT
                      address: 5415, boulevard de l'Assomption, Montréal, QC H1T 2M4
                      lat: 45.57419967651367
                      lon: -73.55850219726562
                    travel_minutes: 16.0
                    distance_km: 9.8
                    estimated_wait_minutes: 216
                    expected_minutes: 232
                    occupancy_rate: 1.2
                    patients_waiting: 25
                    patients_over_24h: 9
                    avg_ambulatory_stay_hours: 3.0
                    reason: 'Compared with #1: 5 min longer drive, 16 min more in the ER.'
                unranked_nearby:
                  - hospital:
                      id: '12475976'
                      name: HÔPITAL DU SACRÉ-COEUR-DE-MONTRÉAL
                      address: 5400, boulevard Gouin Ouest, Montréal, QC H4J 1C5
                      lat: 45.53260040283203
                      lon: -73.71399688720703
                    cause: no_current_data
                disclaimer: Not for life-threatening emergencies. Call 911.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DataUnavailable'

  /v1/hospitals:
    get:
      tags: [Hospitals]
      operationId: listHospitals
      summary: List Quebec ERs with their live status
      parameters:
        - name: region
          in: query
          description: Filter by health region name, as published by MSSS.
          schema:
            type: string
          example: Montréal
        - name: pediatric
          in: query
          description: If true, return only ERs that treat children.
          schema:
            type: boolean
        - name: has_live_data
          in: query
          description: If set, return only ERs with (true) or without (false) current data.
          schema:
            type: boolean
      responses:
        '200':
          description: All matching ERs
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/hospitals/{hospital_id}:
    get:
      tags: [Hospitals]
      operationId: getHospital
      summary: Get one ER with live status and usual occupancy by hour
      parameters:
        - name: hospital_id
          in: path
          required: true
          description: NAVCare hospital identifier.
          schema:
            type: string
          example: H0001
        - name: weekday
          in: query
          description: Day for the hourly pattern (0 = Monday … 6 = Sunday). Defaults to today (Montréal time).
          schema:
            type: integer
            minimum: 0
            maximum: 6
      responses:
        '200':
          description: The ER, its latest status and its hourly pattern
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Service health and data freshness
      security: []
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                time: '2026-10-22T14:05:12-04:00'
                data_updated_at: '2026-10-22T14:00:00-04:00'
                data_age_minutes: 5

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: One key per developer. Default limit 60 requests/minute per key.

  parameters:
    Lat:
      name: lat
      in: query
      required: true
      description: Latitude of the user (WGS 84). Must be within Quebec.
      schema:
        type: number
        format: double
        minimum: 44.9
        maximum: 62.6
      example: 45.497
    Lon:
      name: lon
      in: query
      required: true
      description: Longitude of the user (WGS 84). Must be within Quebec.
      schema:
        type: number
        format: double
        minimum: -79.8
        maximum: -57.1
      example: -73.579
    Lang:
      name: lang
      in: query
      description: Language of the `reason` text.
      schema:
        type: string
        enum: [en, fr]
        default: en

  headers:
    X-Request-ID:
      description: Unique identifier of the request, also stored in the request log.
      schema:
        type: string
        format: uuid
    X-RateLimit-Remaining:
      description: Requests left for this API key in the current minute.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer

  responses:
    BadRequest:
      description: Invalid or missing parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_parameter
              message: lat must be between 44.9 and 62.6 (Quebec).
              request_id: 7f3c2a9e-51b4-4c1e-9a0d-2e6f1b8c4d10
    Unauthorized:
      description: Missing, invalid or inactive API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Missing or invalid X-API-Key header.
              request_id: 7f3c2a9e-51b4-4c1e-9a0d-2e6f1b8c4d10
    NotFound:
      description: Hospital not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded for this API key
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: Limit of 60 requests per minute exceeded.
              request_id: 7f3c2a9e-51b4-4c1e-9a0d-2e6f1b8c4d10
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DataUnavailable:
      description: ER data is temporarily unavailable or too old to rank safely
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    HospitalSummary:
      type: object
      required: [id, name, lat, lon]
      properties:
        id:
          type: string
          example: H0001
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double

    Hospital:
      allOf:
        - $ref: '#/components/schemas/HospitalSummary'
        - type: object
          required: [region, pediatric, has_live_data]
          properties:
            region:
              type: string
              description: Health region, as published by MSSS.
            pediatric:
              type: boolean
              description: True if the ER treats children.
            has_live_data:
              type: boolean
              description: False when MSSS currently publishes no data for this ER.

    LiveStatus:
      type: object
      description: Latest hourly snapshot from the MSSS file.
      required: [captured_at, stretchers, on_stretcher, occupancy_rate]
      properties:
        captured_at:
          type: string
          format: date-time
        stretchers:
          type: integer
          description: Functional stretchers.
        on_stretcher:
          type: integer
          description: Patients currently on a stretcher.
        occupancy_rate:
          type: number
          description: on_stretcher ÷ stretchers. Can exceed 1.0 when the ER is over capacity.
          example: 1.05
        over_24h:
          type: integer
          description: Patients on a stretcher for more than 24 hours.
        over_48h:
          type: integer
          description: Patients on a stretcher for more than 48 hours.
        present:
          type: integer
          description: People present in the ER.
        waiting:
          type: integer
          description: People waiting to be seen by a physician.

    HospitalWithStatus:
      allOf:
        - $ref: '#/components/schemas/Hospital'
        - type: object
          properties:
            status:
              $ref: '#/components/schemas/LiveStatus'
          description: "`status` is omitted when has_live_data is false."

    HourlyStat:
      type: object
      required: [hour, mean_occupancy, sample_count]
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        mean_occupancy:
          type: number
        p90_occupancy:
          type: number
        sample_count:
          type: integer
          description: Number of hourly snapshots used.

    Recommendation:
      type: object
      description: |
        The ER numbers (estimated_wait_minutes to avg_ambulatory_stay_hours) are null only
        when v2 recommended an ER that has no current ER data. v1 never ranks such an ER.
      required: [rank, hospital, travel_minutes, distance_km, estimated_wait_minutes,
                 expected_minutes, occupancy_rate, patients_waiting, patients_over_24h,
                 avg_ambulatory_stay_hours, reason]
      properties:
        rank:
          type: integer
          minimum: 1
        hospital:
          $ref: '#/components/schemas/HospitalSummary'
        travel_minutes:
          type: number
          description: Driving time in live traffic (Google Maps Routes API), adjusted for the weather.
        distance_km:
          type: number
          description: Road distance.
        estimated_wait_minutes:
          type: number
          nullable: true
          description: |
            Estimated minutes in the ER: the average stay of walk-in patients (previous day,
            MSSS) scaled by current stretcher occupancy. Used to compare ERs, not a promise.
        expected_minutes:
          type: number
          nullable: true
          description: travel_minutes + estimated_wait_minutes. v1 ranks by this, lowest first.
        occupancy_rate:
          type: number
          nullable: true
          description: Current stretcher occupancy rate. Can exceed 1.0 when the ER is over capacity.
        patients_waiting:
          type: integer
          nullable: true
          description: People waiting to be seen by a physician.
        patients_over_24h:
          type: integer
          nullable: true
          description: Patients on a stretcher for more than 24 hours.
        avg_ambulatory_stay_hours:
          type: number
          nullable: true
          description: Average stay of walk-in patients on the previous day, in hours.
        reason:
          type: string
          description: Short explanation. v2 writes it in the language of the person's message.

    UnrankedHospital:
      type: object
      required: [hospital, cause]
      properties:
        hospital:
          $ref: '#/components/schemas/HospitalSummary'
        cause:
          type: string
          enum: [no_current_data, stale_data, specialised, no_route]
          description: |
            no_current_data: MSSS publishes no current data for this ER.
            stale_data: MSSS has stopped publishing new data.
            specialised: a children's, mental-health or cardiology ER not chosen for this person.
            no_route: no road route was found.

    RecommendationResponse:
      type: object
      required: [request_id, requested_at, engine, call_911, note, model_usage, data_updated_at,
                 origin, recommendations, disclaimer]
      properties:
        request_id:
          type: string
          format: uuid
        requested_at:
          type: string
          format: date-time
        engine:
          type: string
          enum: [v1, v2, v1_fallback]
          description: Which engine answered. v1_fallback means v2 failed and v1's ranking was returned.
        call_911:
          type: boolean
          nullable: true
          description: |
            True when the message sounds life-threatening: decided by the v2 model, and also
            set by a code check for clear emergency phrases (English and French), whichever
            engine answered. That check can only raise the flag, never lower it. With v1 or
            v1_fallback and no such phrase, null (the rest of the message was not read).
        note:
          type: string
          nullable: true
          description: Optional advice for the person, or a notice that their message was not read.
        model_usage:
          type: object
          nullable: true
          description: v2 only. Model calls, tool calls and tokens used for this request (for cost per request).
          properties:
            model:
              type: string
            model_calls:
              type: integer
            tool_calls:
              type: integer
            prompt_tokens:
              type: integer
            output_tokens:
              type: integer
            calls_without_usage:
              type: integer
              description: Model answers that reported no token counts. Above 0, the token totals are incomplete.
        data_updated_at:
          type: string
          format: date-time
          nullable: true
          description: Time of the MSSS snapshot used. Null when v2 answered without checking ER status.
        origin:
          type: object
          required: [lat, lon]
          properties:
            lat:
              type: number
            lon:
              type: number
        radius_km:
          type: number
          description: Search radius actually used. v1 uses the requested one; v2 chooses its own.
        weather_now:
          type: object
          nullable: true
          description: |
            Open-Meteo forecast for the current hour at the origin. Null when v2 did not
            check the weather.
          properties:
            date:
              type: string
            temperature_2m:
              type: number
            precipitation:
              type: number
            snowfall:
              type: number
        travel_time_multiplier:
          type: number
          description: Factor applied to driving times for the current weather (1.0 = no effect).
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
        unranked_nearby:
          type: array
          description: Nearby ERs that could not be ranked.
          items:
            $ref: '#/components/schemas/UnrankedHospital'
        disclaimer:
          type: string
          example: Not for life-threatening emergencies. Call 911.

    HospitalListResponse:
      type: object
      required: [data_updated_at, count, hospitals]
      properties:
        data_updated_at:
          type: string
          format: date-time
        count:
          type: integer
        hospitals:
          type: array
          items:
            $ref: '#/components/schemas/HospitalWithStatus'

    HospitalDetailResponse:
      type: object
      required: [hospital, weekday, hourly_pattern]
      properties:
        hospital:
          $ref: '#/components/schemas/HospitalWithStatus'
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Day of the hourly pattern (0 = Monday).
        hourly_pattern:
          type: array
          description: Usual occupancy for each hour of that weekday.
          items:
            $ref: '#/components/schemas/HourlyStat'

    HealthResponse:
      type: object
      required: [status, time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: degraded when the latest ER snapshot is older than 2 hours.
        time:
          type: string
          format: date-time
        data_updated_at:
          type: string
          format: date-time
        data_age_minutes:
          type: integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_parameter
                - unauthorized
                - not_found
                - rate_limited
                - data_unavailable
                - internal_error
            message:
              type: string
            request_id:
              type: string
              format: uuid
